[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-inspection-prototype"
version = "0.1.0"
description = "Research prototype for a risk-aware industrial visual inspection pipeline."
requires-python = ">=3.10"
authors = [{name = "Jesse Asemota"}]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "Pillow>=10.0"
]

[project.optional-dependencies]
app = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "nicegui>=3.16,<4.0",
    "psycopg[binary]>=3.3,<4.0",
]
analysis = ["matplotlib>=3.8,<3.11"]
ml = ["torch>=2.1"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
risk-inspect = "risk_aware_inspection.cli:main"
